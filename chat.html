<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Chat</title>
  <style>
    :root {
      --bg: #f4f5f7; --panel: #fff; --text: #1d2129; --muted: #6b7280;
      --border: #e3e5e8; --accent: #4f46e5; --accent-text: #fff; --other: #eceef1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --panel: #1e2126; --text: #e8eaed; --muted: #9aa0a8;
        --border: #2d3138; --accent: #6366f1; --accent-text: #fff; --other: #2a2e35;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .hidden { display: none !important; }

    /* Join screen */
    #join { height: 100%; display: grid; place-items: center; padding: 16px; }
    #join form { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 360px; display: grid; gap: 12px; }
    #join h1 { margin: 0; font-size: 1.3rem; }
    #join p { margin: 0; color: var(--muted); font-size: .9rem; }

    /* Chat layout */
    #app { height: 100%; max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 200px; grid-template-rows: auto 1fr; background: var(--panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 1.05rem; }
    #status { font-size: .8rem; color: var(--muted); }
    #status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; margin-right: 6px; }
    #status.ok::before { background: #22c55e; }
    #status.bad::before { background: #ef4444; }

    main { display: grid; grid-template-rows: 1fr auto auto; min-height: 0; }
    #messages { list-style: none; margin: 0; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; background: var(--other); overflow-wrap: anywhere; }
    .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-text); }
    .msg .meta { font-size: .72rem; opacity: .75; margin-bottom: 2px; }
    .msg .meta time { margin-left: 6px; }
    .msg .body { white-space: pre-wrap; }
    .sys { align-self: center; font-size: .78rem; color: var(--muted); }

    #typing { min-height: 20px; padding: 0 16px; font-size: .78rem; color: var(--muted); font-style: italic; }
    #chat-form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }

    aside { border-left: 1px solid var(--border); padding: 12px 16px; overflow-y: auto; }
    aside h2 { margin: 0 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    #users { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .9rem; }
    #users li::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 8px; }

    input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #join-error { color: #ef4444; font-size: .85rem; min-height: 1.2em; }

    @media (max-width: 640px) {
      #app { grid-template-columns: 1fr; }
      aside { display: none; }
      .msg { max-width: 88%; }
    }
  </style>
</head>
<body>

  <!-- Join screen -->
  <section id="join">
    <form id="join-form">
      <h1>Join the chat</h1>
      <p>Pick a display name. Open another tab to chat with yourself.</p>
      <input id="name" maxlength="20" autocomplete="off" placeholder="Your name" required autofocus>
      <div id="join-error"></div>
      <button type="submit">Join</button>
    </form>
  </section>

  <!-- Chat screen -->
  <div id="app" class="hidden">
    <header>
      <h1>Real-time Chat</h1>
      <span id="status">Connecting...</span>
    </header>

    <main>
      <ul id="messages"></ul>
      <div id="typing"></div>
      <form id="chat-form">
        <input id="message" maxlength="2000" autocomplete="off" placeholder="Type a message..." required>
        <button type="submit">Send</button>
      </form>
    </main>

    <aside>
      <h2>Online (<span id="user-count">0</span>)</h2>
      <ul id="users"></ul>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const joinScreen = $("join"), app = $("app");
    const statusEl = $("status"), messagesEl = $("messages");
    const input = $("message"), typingEl = $("typing");

    let username = null;
    const typingUsers = new Set();

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function renderMessage(m) {
      const li = document.createElement("li");
      if (m.type === "system") {
        li.className = "sys";
        li.textContent = m.text;
      } else {
        li.className = "msg" + (m.username === username ? " me" : "");
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = m.username === username ? "You" : m.username;
        const time = document.createElement("time");
        time.textContent = new Date(m.sentAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        meta.appendChild(time);
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = m.text;
        li.append(meta, body);
      }
      messagesEl.appendChild(li);
      scrollToBottom();
    }

    function renderUsers(list) {
      $("user-count").textContent = list.length;
      const ul = $("users");
      ul.replaceChildren(...list.map((name) => {
        const li = document.createElement("li");
        li.textContent = name === username ? `${name} (you)` : name;
        return li;
      }));
    }

    function renderTyping() {
      const names = [...typingUsers];
      typingEl.textContent =
        names.length === 0 ? "" :
        names.length === 1 ? `${names[0]} is typing...` :
        `${names.slice(0, 2).join(", ")}${names.length > 2 ? " and others" : ""} are typing...`;
    }

    // ---- Join ----
    function join(name) {
      socket.emit("join", name, (res) => {
        if (!res.success) { $("join-error").textContent = res.error; return; }
        username = res.username;
        joinScreen.classList.add("hidden");
        app.classList.remove("hidden");
        messagesEl.replaceChildren();
        res.history.forEach(renderMessage);
        input.focus();
      });
    }

    $("join-form").addEventListener("submit", (e) => {
      e.preventDefault();
      $("join-error").textContent = "";
      if (!socket.connected) { $("join-error").textContent = "Not connected yet. Try again."; return; }
      join($("name").value);
    });

    // ---- Connection state ----
    socket.on("connect", () => {
      setStatus("Connected", "ok");
      if (username) join(username); // auto-rejoin after a reconnect
    });
    socket.on("disconnect", () => setStatus("Disconnected", "bad"));
    socket.on("connect_error", () => setStatus("Connection failed. Retrying...", "bad"));

    // ---- Incoming events ----
    socket.on("message", renderMessage);
    socket.on("users", renderUsers);
    socket.on("typing", ({ username: name, isTyping }) => {
      isTyping ? typingUsers.add(name) : typingUsers.delete(name);
      renderTyping();
    });

    // ---- Sending ----
    let typingTimer = null;
    input.addEventListener("input", () => {
      socket.emit("typing", true);
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit("typing", false), 1500);
    });

    $("chat-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value;
      if (!text.trim()) return;
      if (!socket.connected) { setStatus("Not connected. Please wait...", "bad"); return; }
      socket.emit("message", text, (res) => {
        if (!res.success) setStatus(res.error, "bad");
      });
      clearTimeout(typingTimer);
      socket.emit("typing", false);
      input.value = "";
    });
  </script>
</body>
</html>
